openapi: 3.1.0
info:
  title: Recursive Schema Boundary
  version: 1.0.0
paths:
  /nodes:
    post:
      operationId: createNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Node'
components:
  schemas:
    Node:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        next:
          $ref: '#/components/schemas/Node'
