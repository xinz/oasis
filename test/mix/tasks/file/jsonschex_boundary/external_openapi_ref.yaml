# yaml-language-server: $schema=https://spec.openapis.org/oas/3.1/schema/2022-10-07
openapi: 3.1.0
info:
  title: External OpenAPI Ref Boundary
  version: 1.0.0
components:
  securitySchemes:
    UserBearer:
      $ref: './common.yaml#/components/securitySchemes/UserBearer'
paths:
  /users/{id}:
    get:
      operationId: getUser
      security:
        - UserBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/UserId'
